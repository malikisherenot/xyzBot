name: Build

# Manual only: Actions tab -> Build -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build iOS (experimental)"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: iOS, os: macos-latest, target: iOS }
          - { name: Android32, os: ubuntu-latest, target: Android32 }
          - { name: Android64, os: ubuntu-latest, target: Android64 }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ matrix.config.name != 'iOS' || inputs.ios }}
      - uses: geode-sdk/build-geode-mod@main
        if: ${{ matrix.config.name != 'iOS' || inputs.ios }}
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: xyzBot
          path: ${{ steps.build.outputs.build-output }}
